services:
  - type: web
    name: aqualog
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CRON_SECRET
        value: crn_93814fe4db8388e5f95a0eaa80149aaa
      # AI advisor + council review — must be set in Render dashboard (sync:false = secret)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Auth persistence across container restarts (ephemeral filesystem wipes data/users.json)
      # Set this to the full users array JSON in Render dashboard
      - key: AUTH_USERS_JSON
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: ariley

  - type: cron
    name: aqualog-check-day-shift
    runtime: node
    buildCommand: npm install
    startCommand: node scripts/check-missed-shifts.js
    schedule: "0 18 * * 1-5"
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        value: https://medstarh20log.com
      - key: CRON_SECRET
        value: crn_93814fe4db8388e5f95a0eaa80149aaa

  - type: cron
    name: aqualog-check-evening-shift
    runtime: node
    buildCommand: npm install
    startCommand: node scripts/check-missed-shifts.js
    schedule: "0 2 * * 2-6"
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        value: https://medstarh20log.com
      - key: CRON_SECRET
        value: crn_93814fe4db8388e5f95a0eaa80149aaa

  - type: cron
    name: aqualog-check-night-shift
    runtime: node
    buildCommand: npm install
    startCommand: node scripts/check-missed-shifts.js
    schedule: "0 10 * * 1-6"
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        value: https://medstarh20log.com
      - key: CRON_SECRET
        value: crn_93814fe4db8388e5f95a0eaa80149aaa

  # End-of-day report: full prior day (missed + out-of-range), 6:00 AM ET daily.
  - type: cron
    name: aqualog-daily-report
    runtime: node
    buildCommand: npm install
    startCommand: node scripts/daily-report.js
    schedule: "0 10 * * *"
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        value: https://medstarh20log.com
      - key: CRON_SECRET
        value: crn_93814fe4db8388e5f95a0eaa80149aaa
